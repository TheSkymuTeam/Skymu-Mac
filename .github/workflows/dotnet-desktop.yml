name: Skymu for Mac Core/Modern

on:
  push:
    branches: [ "xamarin" ]
  pull_request:
    branches: [ "xamarin" ]

jobs:
  build:
    runs-on: macos-26 # 27 is not working according to a tester
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x.x
    - name: Build fire emoji
      run: dotnet build SkymuMacCore.sln
    - name: And upload colon three
      uses: actions/upload-artifact@v7
      with:
        path: 'SkymuMac/bin/'
        retention-days: 7
        archive: true
