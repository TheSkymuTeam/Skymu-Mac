name: Skymu for Mac Legacy/Xamarin

on:
  push:
    branches: [ "xamarin" ]
  pull_request:
    branches: [ "xamarin" ]

jobs:
  build:
    runs-on: motherfuckingos
    env:
      Solution_Name: SkymuMacLegacy.sln
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: And upload :3
      uses: actions/upload-artifact@v7
      with:
        path: 'SkymuMac/bin/'
        retention-days: 7
        archive: true
